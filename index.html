*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#17120e}
body{touch-action:none;font-family:Arial,sans-serif}
#game{position:relative;width:100vw;height:100dvh;display:flex;align-items:center;justify-content:center;overflow:hidden}
#screen{position:relative;height:100dvh;width:min(100vw,66.6667dvh);aspect-ratio:2/3;overflow:hidden;user-select:none}
#art{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;image-rendering:auto}
.hit{position:absolute;border:0;background:transparent;cursor:pointer;z-index:10}
.hit:active{background:rgba(255,255,255,.12)}
#toast{position:absolute;z-index:50;left:8%;right:8%;top:47%;padding:11px 14px;border:3px solid #f2d18e;border-radius:12px;background:rgba(45,31,22,.96);color:#fff0c6;text-align:center;font-size:13px;font-weight:700;display:none}
#dialog{position:absolute;z-index:60;inset:12% 8%;display:none;background:#f2dfb6;color:#493020;border:5px solid #5b3a25;border-radius:16px;box-shadow:0 8px 0 #2e2018;padding:16px;overflow:auto}
#dialog h2{margin:0 0 12px;font-size:20px}
.row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:2px solid #c9a878;font-size:13px}
.dialog-btn{width:100%;margin-top:14px;height:46px;border:0;border-radius:10px;background:#a94835;color:#fff;font-weight:800}
#debug{position:absolute;left:0;right:0;bottom:0;height:22px;z-index:70;pointer-events:none;background:rgba(0,0,0,.28);color:#fff;font-size:9px;text-align:center;padding:5px;opacity:.55}
</style>

<script>
(() => {
  const screen=document.getElementById('screen');
  const toastEl=document.getElementById('toast');
  const dialog=document.getElementById('dialog');

  const customers=[
    ['Sinh viên nam','Cà phê sữa',32000],
    ['Sinh viên nữ','Trà sữa',40000],
    ['Dân văn phòng','Trà chanh',30000],
    ['Shipper','Nước cam',35000],
    ['Khách quen','Cà phê đen',28000]
  ];
  const ingredients=[
    'Cà phê','Trà','Sữa','Đường','Đá',
    'Trống','Trân châu','Thạch','Chanh','Cam','Đào',
    'Trống','Trống','Trống','Trống'
  ];

  const state={
    day:1,money:1000000,rating:3.5,orders:0,selected:-1,
    cup:false,hasIngredients:false,prepared:false,paid:false
  };

  function toast(msg){
    toastEl.textContent=msg;
    toastEl.style.display='block';
    clearTimeout(window.__toast);
    window.__toast=setTimeout(()=>toastEl.style.display='none',1400);
  }

  function selectedName(){
    return state.selected>=0 ? customers[state.selected][0] : '';
  }

  function resetOrder(){
    state.cup=false;state.hasIngredients=false;state.prepared=false;state.paid=false;
  }

  function selectCustomer(i){
    state.selected=i;resetOrder();
    toast('Đã chọn '+customers[i][0]+' • '+customers[i][1]);
  }

  function ingredient(i){
    if(i>=15)return;
    if(ingredients[i]==='Trống') return toast('Slot này đang để dành cho nguyên liệu mới');
    if(state.selected<0)return toast('Hãy chọn khách trước');
    state.hasIngredients=true;
    toast('Đã lấy '+ingredients[i]);
  }

  function chooseCup(){
    if(state.selected<0)return toast('Hãy chọn khách trước');
    state.cup=true;toast('Đã chọn ly cho '+customers[state.selected][1]);
  }

  function prep(){
    if(state.selected<0)return toast('Hãy chọn khách trước');
    if(!state.cup)return toast('Chọn ly trước');
    if(!state.hasIngredients)return toast('Lấy nguyên liệu trước');
    toast('Đang pha chế...');
    setTimeout(()=>{state.prepared=true;toast('Món đã hoàn thành • Bấm HOÀN THÀNH rồi THU TIỀN')},650);
  }

  function finish(){
    if(!state.prepared)return toast('Chưa pha xong món');
    toast('Hoàn thành đơn của '+selectedName());
  }

  function collect(){
    if(state.selected<0)return toast('Chưa có khách được chọn');
    if(!state.prepared)return toast('Chưa có món hoàn thành');
    if(state.paid)return toast('Đơn này đã thu tiền');
    state.money+=customers[state.selected][2];state.orders++;state.paid=true;
    toast('Đã thu '+customers[state.selected][2].toLocaleString('vi-VN')+'đ');
  }

  function panel(type){
    let title='', rows='';
    if(type==='home'){
      title='TRANG CHỦ';
      rows=[['Ngày',''+state.day],['Tiền',state.money.toLocaleString('vi-VN')+'đ'],['Uy tín',state.rating.toFixed(1)],['Đơn đã thu',''+state.orders]];
    } else if(type==='upgrade'){
      title='NÂNG CẤP QUẦY';
      rows=[['Tủ đá','150.000đ'],['Máy xay','220.000đ'],['Tủ lạnh','300.000đ'],['Biển hiệu','180.000đ'],['Thuê phụ việc','400.000đ']];
    } else if(type==='recipe'){
      title='CÔNG THỨC';
      rows=[['Cà phê đen','28.000đ'],['Cà phê sữa','32.000đ'],['Trà chanh','30.000đ'],['Nước cam','35.000đ'],['Trà sữa','40.000đ']];
    } else if(type==='staff'){
      title='NHÂN VIÊN';
      rows=[['Chủ quán','Đang làm việc'],['Phụ việc','Chưa thuê']];
    } else {
      title='ĐIỆN THOẠI';
      rows=[['Marketing','50.000đ'],['Phương tiện','Khóa'],['Công việc mới','Khóa']];
    }
    dialog.innerHTML='<h2>'+title+'</h2>'+rows.map(r=>'<div class="row"><span>'+r[0]+'</span><b>'+r[1]+'</b></div>').join('')+'<button class="dialog-btn" type="button" id="closeDialog">ĐÓNG</button>';
    dialog.style.display='block';
    document.getElementById('closeDialog').onclick=()=>dialog.style.display='none';
  }

  document.querySelectorAll('.hit').forEach(btn=>btn.addEventListener('click',()=>{
    const a=btn.dataset.action;
    if(a==='customer')selectCustomer(Number(btn.dataset.i));
    else if(a==='ingredient')ingredient(Number(btn.dataset.i));
    else if(a==='choose')chooseCup();
    else if(a==='prep')prep();
    else if(a==='finish')finish();
    else if(a==='collect')collect();
    else if(a==='blender')toast('Máy xay sẵn sàng');
    else if(a==='board')toast('Khu thớt: chuẩn bị trái cây');
    else if(a==='cup')toast('Khu pha chế');
    else if(a==='ice')toast('Đá đã sẵn sàng');
    else if(a==='panel')panel(btn.dataset.panel);
  }));
})();
</script>
</body>
</html>
